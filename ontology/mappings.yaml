# Mapping layer: ontology entities -> physical OMOP CDM v5.4 tables.
# For a non-OMOP warehouse, change these mappings (and keep the vocabulary layer).
schemas:
  cdm: cdm
  vocab: vocab
  results: results

person:
  table: person
  person_key: person_id
  gender_col: gender_concept_id
  year_of_birth_col: year_of_birth

observation_period:
  table: observation_period
  start_col: observation_period_start_date
  end_col: observation_period_end_date

entities:
  ConditionOccurrence:
    table: condition_occurrence
    concept_col: condition_concept_id
    start_col: condition_start_date
    end_col: condition_end_date
  DrugExposure:
    table: drug_exposure
    concept_col: drug_concept_id
    start_col: drug_exposure_start_date
    end_col: drug_exposure_end_date
  Measurement:
    table: measurement
    concept_col: measurement_concept_id
    start_col: measurement_date
    end_col: measurement_date
    value_col: value_as_number
    unit_col: unit_concept_id
  ProcedureOccurrence:
    table: procedure_occurrence
    concept_col: procedure_concept_id
    start_col: procedure_date
    end_col: procedure_date
  VisitOccurrence:
    table: visit_occurrence
    concept_col: visit_concept_id
    start_col: visit_start_date
    end_col: visit_end_date
