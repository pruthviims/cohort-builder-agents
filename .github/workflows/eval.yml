name: eval
# Live evaluation against the Anthropic API. Run manually, and before releasing
# any change to prompts, model, ontology or compiler.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Repeats per golden case"
        default: "3"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,dev]"
      - run: cohort-builder init-demo
      - run: cohort-builder eval --repeats ${{ inputs.repeats }} --out eval_report.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.json
