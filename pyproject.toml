[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-builder-agents"
version = "0.1.0"
description = "Reproducible LLM agents with a semantic ontology for building OMOP patient cohorts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=2.2,<3", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "mcp>=2.2,<3", "anyio>=4"]

[project.scripts]
cohort-builder = "cohort_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
