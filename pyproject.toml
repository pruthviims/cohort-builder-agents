[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-builder-agents"
version = "0.1.0"
description = "Reproducible LLM agents with a semantic ontology for building OMOP patient cohorts"
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds unchanged; upper bounds stop at the next major version to avoid surprise breakage.
dependencies = [
  "duckdb>=1.0,<2",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "anthropic>=0.40,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
mcp = ["mcp>=2.2,<3", "uvicorn>=0.29,<1", "pyjwt>=2.15"]  # pyjwt: security floor for an mcp dependency
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "fastapi>=0.110,<1", "mcp>=2.2,<3", "pyjwt>=2.15",
  "anyio>=4,<5",
  "ruff>=0.16,<0.17", "mypy>=2.3,<3", "types-PyYAML>=6.0", "pip-audit>=2.7,<3", "detect-secrets>=1.5,<2",
  "pglast>=7,<9",               # PostgreSQL parser for dialect checks of compiled SQL
  "psycopg[binary]>=3.1,<4",    # runs compiled SQL on PostgreSQL when CB_TEST_POSTGRES_DSN is set
]

[project.scripts]
cohort-builder = "cohort_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP037"]  # keep quoted forward references in return annotations

[tool.ruff.lint.isort]
known-first-party = ["cohort_builder"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
# B023: closures are created and called within the same loop iteration (per-patient helpers,
# immediately-invoked step lambdas), so late binding cannot occur
"src/cohort_builder/synthetic.py" = ["B023"]
"src/cohort_builder/synthetic_laad.py" = ["B023"]
"src/cohort_builder/orchestrator.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
files = ["src/cohort_builder"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["cohort_builder"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true
